<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <section>
        <form action="">
            <div>
                <label for="first-name">First name:</label>
                <input type="text" name="first-name" id="first-name" placeholder="Firstname" required>
            </div>
            <div>
                <label for="last-name">Last name:</label>
                <input type="text" name="last-name" id="last-name" placeholder="Lastname" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="Email" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" placeholder="Password" required>
            </div>
            <div>
                <label for="dob">Date of birth:</label>
                <input type="date" name="dob" id="dob" required>
            </div>
            <div>
                <p>Gender:</p>

                <input type="radio" name="gender" id="male" value="male" required>
                <label for="male">Male</label>

                <input type="radio" name="gender" id="female" value="female" required>
                <label for="female">Female</label>
            </div>
            <div>
                <label for="countries">Country:</label>
                <select name="countries" id="countries">
                    <option value="usa" selected>USA</option>
                    <option value="china">China</option>
                    <option value="italy">Italy</option>
                    <option value="france">France</option>
                    <option value="nigeria">Nigeria</option>
                </select>
            </div>
            <div>
                <label for="levels">Experience level:</label>
                <select name="levels" id="levels">
                    <option value="0to2" selected>0 to 2 years</option>
                    <option value="2to5">2 to 5 years</option>
                    <option value="5++">5+ years</option>
                </select>
            </div>
            <div>
                <label>Programming languages:</label>
                <input type="text" name="languages" id="languages" placeholder="Languages" required>
            </div>
            <div>
                <label for="bio">Bio:</label>
                <textarea id="bio" rows="4" cols="30" required></textarea>
            </div>
            <div>
                <input type="checkbox" name="agree" id="agree" required>
                <a href=""><label for="agree">Terms & Conditionals</label></a>
            </div>
            <div>
                <button type="submit">Sign Up</button>
            </div>
        </form>
    </section>
</body>
</html>
